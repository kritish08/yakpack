name: CI / Migrate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - name: Test
        run: pnpm test

      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  migrate:
    name: Supabase — apply migrations
    # Only on merges to main, and only after CI passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --include-all is required, not a shortcut. Production applied the
      # realtime-publication migration as 20260828172427, and multi_tenancy
      # (140000) and trip_bootstrap (160000) sort before it, so the CLI refuses
      # to insert them without explicit consent. That refusal is the right
      # default — inserting migrations behind the high-water mark is how two
      # databases silently diverge — but here those two genuinely have not run
      # yet, and the resulting sequence was rehearsed against a copy of
      # production's real data before this was enabled.
      - name: Push pending migrations
        run: |
          supabase link --project-ref uhocrvejirshtpclagzk
          supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
